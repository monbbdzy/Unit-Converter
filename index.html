<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Unit Converter</title>
  <style>
    hr.solid {
      border-top: 3px solid #bbb;
    }
  </style>
</head>
<body>

<h1>Unit Converter</h1>
<hr class="solid">
<div class="tabs">
<button class="tab" onclick="openCategory(event, 'length')">Length</button>
<button class="tab" onclick="openCategory(event, 'weight')">Weight</button>
<button class="tab" onclick="openCategory(event, 'temperature')">Temperature</button>
</div>

<div class="convertPage">
  <!-- There will be a text: Enter the length to convert  -->
  <h2 id = "categoryName"></h2>  
  <input type="text" id="inputValue" placeholder="Enter value">
  <br><br>

  <label for="fromUnit">Unit to convert from: </label>
  <select  class="units"></select>
<br><br>

  <label id="toUnit">Unit to convert to: </label>
  <select class ='units'></select>
  <br><br>

  <button class="convertBtn" onclick="showResult(event)">Convert</button>
</div>

<div class="resultPage">
  <h2>Result of your calculation</h2>
  <h1 id="result">Result will appear here </h1>
  <button id="reset" onclick ="resetPage(event)">Reset</button>
</div>

<script>
//Define the category objects
let length, weight, temperature; 

//Categories data 
const categories = {
  length: [['Milimeters', 'mm'],['Centimeters', 'cm'], ['Meters', 'm'], ['Kilometers', 'km']],
  weight: [['Milligrams', 'mg'], ['Grams', 'g'], ['Kilograms', 'kg'], ['Tonnes', 't']],
  temperature : [['degree Celsius', 'C'], ['degree Fahrenheit', 'F'], ['Kelvin', 'K']]
};


function openCategory(evt, categoryName) {
  // when pressed a proper category window will be shown 
  let status = categoryName; 
  //Adapt the header accordingly 
  let headerText = document.getElementById('categoryName');
  headerText.textContent = `Enter the ${status} to convert`; 

  //Append according options
  let selectElement = document.querySelectorAll('.units');

  selectElement.forEach(element => {
    // Clean up the previous options if there are any 
    if (element.options.length != 0) {
      element.options.length = 0;
    }  
    categories[status].forEach(category => { //will this work? since status = 'length'
    // create new Option(text, value)
    const option = new Option(category[0], category[1]);
    element.appendChild(option);
    });
  });
}

function showResult(evt){
  //once the button is clicked, show the hidden div with the result
}

function resetPage(evt){
  // when pressed, the page will be reset 
}
</script>
</body>
</html>
